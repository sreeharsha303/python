<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form</title>
</head>
<body>
    <h1> enter your details </h1>
    <form>
        <input type="text" placeholder="enter your name"><br><br>
        <input type="email" placeholder="enter your email"><br><br>
        <input type="password" placeholder="enter your password"><br><br>
        <input type="datetime-local" placeholder="enter your date of birth"><br><br>
        <input type="choose" placeholder="choose your file"><br><br>
        <hr>
        <label for="gender">Gender:</label><br>
        <input type="radio" name="gender" id="male">
        <label for="male">Male</label><br>
        <input type="radio" name="gender" id="female">
        <label for="female">Female</label><br>

         <hr>
         <lable for="programming">Programming:</lable><br>
        <input type="checkbox" name="programming" id="python">
        <label for="python">Python</label><br>  
        <input type="checkbox" name="programming" id="java">
        <label for="java">Java</label><br>

        <label for="">select department</label>
        <select name="department" id="department">
            <option value="cse">CSE</option>
            <option value="ece">ECE</option>
            <option value="eee">EEE</option>
            <option value="civil">CIVIL</option><br>
        </select><br><br>

        <input type="submit" value="Submit">
        <input type="reset" value="Reset"><br><br>

        
    </form>
</body>
</html>
