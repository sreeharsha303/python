<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
        <h1>textarea</h1>
        <textarea cols="5px" rows="5px"> </textarea><br><br>
        <label for="menu">select your menu</label>
        <select>
            <optgroup label="veg">
                <option value="">dosa</option>
                <option value="">idli</option>
                <option value="">vada</option>
                <option value="">poori</option>
            </optgroup>
            <optgroup label="non-veg">
                <option value="">chicken</option>
                <option value="">mutton</option>
                <option value="">fish</option>
                <option value="">prawns</option>
            </optgroup>
        </select><br><br>

    <input type="text" placeholder="enter your college name" list="college"><br><br>
    <datalist id="college">
        <option value="dsatm">DSATM</option>
        <option value="vtu">VTU</option>
        <option value="anna">Anna University</option>
        <option value="ms">MS University</option>
        <option value="dsu">DSU</option>
    </datalist>
</body>
</html>
