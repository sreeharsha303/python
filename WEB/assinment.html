
<!DOCTYPE html>
<html>
<head>
    <title>Seminar Timetable</title>

  
</head>

<body>

<h2>Seminar Timetable</h2>

<table Border="1">
    <tr>
        <th rowspan="3">Day</th>
        <th colspan="3">Seminar</th>
    </tr>

    <tr>
        <th colspan="2">Schedule</th>
        <th rowspan="2">Topic</th>
    </tr>

    <tr>
        <th>Begin</th>
        <th>End</th>
    </tr>

    <tr>
        <td rowspan="2">Monday</td>
        <td rowspan="2" class="begin">8:00 a.m.</td>
        <td rowspan="2" class="end">5:00 p.m.</td>
        <td>Introduction to XML</td>
    </tr>

    <tr>
        <td>Validity: DTD and Relax NG</td>
    </tr>

    <tr>
        <td rowspan="3">Tuesday</td>
        <td class="begin">8:00 a.m.</td>
        <td class="end">11:00 a.m.</td>
        <td>XPath</td>
    </tr>

    <tr>
        <td class="begin">11:00 a.m.</td>
        <td class="green">2:00 p.m.</td>
        <td rowspan="2">XSL Transformations</td>
    </tr>

    <tr>
        <td class="green">2:00 p.m.</td>
        <td class="end">5:00 p.m.</td>
    </tr>

    <tr>
        <td>Wednesday</td>
        <td class="begin">8:00 a.m.</td>
        <td class="green">12:00 p.m.</td>
        <td>XSL Formatting Objects</td>
    </tr>

</table>

</body>
</html>
